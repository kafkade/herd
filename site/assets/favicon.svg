<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pixel art favicon — compact sheep -->
  <rect width="32" height="32" rx="6" fill="#0a0e17"/>

  <!-- Wool row 1 -->
  <rect x="11" y="6" width="3" height="3" fill="#f0ebe5"/>
  <rect x="14" y="6" width="3" height="3" fill="#f5f0eb"/>
  <rect x="17" y="6" width="3" height="3" fill="#f0ebe5"/>
  <rect x="20" y="6" width="3" height="3" fill="#f5f0eb"/>

  <!-- Wool row 2 -->
  <rect x="8" y="9" width="3" height="3" fill="#f5f0eb"/>
  <rect x="11" y="9" width="3" height="3" fill="#faf7f4"/>
  <rect x="14" y="9" width="3" height="3" fill="#f5f0eb"/>
  <rect x="17" y="9" width="3" height="3" fill="#faf7f4"/>
  <rect x="20" y="9" width="3" height="3" fill="#f5f0eb"/>
  <rect x="23" y="9" width="3" height="3" fill="#f0ebe5"/>

  <!-- Head + body -->
  <rect x="4" y="12" width="3" height="3" fill="#2d2f3d"/>
  <rect x="7" y="12" width="3" height="3" fill="#2d2f3d"/>
  <rect x="10" y="12" width="3" height="3" fill="#ede7e0"/>
  <rect x="13" y="12" width="3" height="3" fill="#f0ebe5"/>
  <rect x="16" y="12" width="3" height="3" fill="#ede7e0"/>
  <rect x="19" y="12" width="3" height="3" fill="#f0ebe5"/>
  <rect x="22" y="12" width="3" height="3" fill="#ede7e0"/>
  <rect x="25" y="12" width="3" height="3" fill="#f5f0eb"/>
  <!-- Eyes -->
  <rect x="5" y="13" width="1.5" height="1.5" fill="#f0ebe5"/>
  <rect x="8" y="13" width="1.5" height="1.5" fill="#f0ebe5"/>
  <rect x="5.3" y="13.3" width="0.8" height="0.8" fill="#0a0e17"/>
  <rect x="8.3" y="13.3" width="0.8" height="0.8" fill="#0a0e17"/>

  <!-- Body row 2 -->
  <rect x="7" y="15" width="3" height="3" fill="#2d2f3d"/>
  <rect x="10" y="15" width="3" height="3" fill="#f0ebe5"/>
  <rect x="13" y="15" width="3" height="3" fill="#ede7e0"/>
  <rect x="16" y="15" width="3" height="3" fill="#f0ebe5"/>
  <rect x="19" y="15" width="3" height="3" fill="#ede7e0"/>
  <rect x="22" y="15" width="3" height="3" fill="#f0ebe5"/>
  <rect x="25" y="15" width="3" height="3" fill="#ede7e0"/>

  <!-- Legs -->
  <rect x="10" y="18" width="3" height="4" fill="#2d2f3d"/>
  <rect x="15" y="18" width="3" height="4" fill="#2d2f3d"/>
  <rect x="20" y="18" width="3" height="4" fill="#2d2f3d"/>
  <rect x="25" y="18" width="3" height="4" fill="#2d2f3d"/>

  <!-- Green accent -->
  <rect x="12" y="25" width="8" height="2" rx="1" fill="#6ee7b7" opacity="0.6"/>
</svg>
