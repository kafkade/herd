<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Proposal 8: Pixel Art Sheep
       Retro pixel/grid aesthetic matching the terminal/CLI vibe.
       Built from small rectangles on a grid. -->
  <rect width="512" height="512" rx="64" fill="#0a0e17"/>

  <!-- Grid dots background (subtle) -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#1e293b"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#grid)"/>

  <!-- Pixel sheep — 24px grid blocks -->
  <!-- Wool row 1 (top) -->
  <rect x="192" y="120" width="24" height="24" rx="2" fill="#f0ebe5"/>
  <rect x="216" y="120" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="240" y="120" width="24" height="24" rx="2" fill="#f0ebe5"/>
  <rect x="264" y="120" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="288" y="120" width="24" height="24" rx="2" fill="#f0ebe5"/>

  <!-- Wool row 2 -->
  <rect x="168" y="144" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="192" y="144" width="24" height="24" rx="2" fill="#faf7f4"/>
  <rect x="216" y="144" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="240" y="144" width="24" height="24" rx="2" fill="#faf7f4"/>
  <rect x="264" y="144" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="288" y="144" width="24" height="24" rx="2" fill="#faf7f4"/>
  <rect x="312" y="144" width="24" height="24" rx="2" fill="#f0ebe5"/>

  <!-- Wool row 3 + head -->
  <rect x="120" y="168" width="24" height="24" rx="2" fill="#2d2f3d"/> <!-- ear -->
  <rect x="144" y="168" width="24" height="24" rx="2" fill="#2d2f3d"/> <!-- head -->
  <rect x="168" y="168" width="24" height="24" rx="2" fill="#2d2f3d"/> <!-- head -->
  <rect x="192" y="168" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="216" y="168" width="24" height="24" rx="2" fill="#f0ebe5"/>
  <rect x="240" y="168" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="264" y="168" width="24" height="24" rx="2" fill="#f0ebe5"/>
  <rect x="288" y="168" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="312" y="168" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="336" y="168" width="24" height="24" rx="2" fill="#f0ebe5"/>

  <!-- Face row with eyes -->
  <rect x="144" y="192" width="24" height="24" rx="2" fill="#2d2f3d"/>
  <rect x="168" y="192" width="24" height="24" rx="2" fill="#2d2f3d"/>
  <rect x="192" y="192" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="216" y="192" width="24" height="24" rx="2" fill="#faf7f4"/>
  <rect x="240" y="192" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="264" y="192" width="24" height="24" rx="2" fill="#faf7f4"/>
  <rect x="288" y="192" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="312" y="192" width="24" height="24" rx="2" fill="#faf7f4"/>
  <rect x="336" y="192" width="24" height="24" rx="2" fill="#ede7e0"/>
  <!-- Eyes on face -->
  <rect x="148" y="196" width="8" height="8" rx="1" fill="#f0ebe5"/>
  <rect x="166" y="196" width="8" height="8" rx="1" fill="#f0ebe5"/>
  <rect x="150" y="198" width="4" height="4" fill="#0a0e17"/>
  <rect x="168" y="198" width="4" height="4" fill="#0a0e17"/>

  <!-- Body rows -->
  <rect x="144" y="216" width="24" height="24" rx="2" fill="#2d2f3d"/> <!-- nose -->
  <rect x="168" y="216" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="192" y="216" width="24" height="24" rx="2" fill="#f0ebe5"/>
  <rect x="216" y="216" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="240" y="216" width="24" height="24" rx="2" fill="#f0ebe5"/>
  <rect x="264" y="216" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="288" y="216" width="24" height="24" rx="2" fill="#f0ebe5"/>
  <rect x="312" y="216" width="24" height="24" rx="2" fill="#ede7e0"/>

  <rect x="168" y="240" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="192" y="240" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="216" y="240" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="240" y="240" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="264" y="240" width="24" height="24" rx="2" fill="#f5f0eb"/>
  <rect x="288" y="240" width="24" height="24" rx="2" fill="#ede7e0"/>
  <rect x="312" y="240" width="24" height="24" rx="2" fill="#f5f0eb"/>

  <!-- Legs -->
  <rect x="180" y="264" width="24" height="28" rx="2" fill="#2d2f3d"/>
  <rect x="220" y="264" width="24" height="28" rx="2" fill="#2d2f3d"/>
  <rect x="268" y="264" width="24" height="28" rx="2" fill="#2d2f3d"/>
  <rect x="308" y="264" width="24" height="28" rx="2" fill="#2d2f3d"/>

  <!-- "herd" text below in pixel-style -->
  <text x="256" y="360" font-family="Consolas,Monaco,monospace" font-size="48" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="8">herd</text>

  <!-- Green accent underline -->
  <rect x="156" y="375" width="200" height="3" rx="1.5" fill="#6ee7b7" opacity="0.4"/>
</svg>
